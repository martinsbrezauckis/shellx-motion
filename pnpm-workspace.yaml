packages:
  - "packages/*"

# Dependency build scripts must be declared, or a clean install refuses to run them.
#
# pnpm 11 made `strictDepBuilds: true` the default: a dependency carrying a postinstall script is
# treated as unreviewed, and `pnpm install` exits non-zero with ERR_PNPM_IGNORED_BUILDS. esbuild is
# the one dependency here that needs its postinstall — it places the platform binary that `tsx` and
# `vitest` both load — so without this declaration a fresh clone cannot install, and `pnpm build`
# fails as well, because its dependency-status check re-runs the install.
#
# An existing installation may already have esbuild's platform binary and mask a missing build
# permission. Fresh installs need this declaration.
#
# The two majors spell the setting differently and each ignores the other's key, so both are listed:
#   pnpm 11+   -> allowBuilds            (onlyBuiltDependencies was REMOVED, not deprecated)
#   pnpm 10.6+ -> onlyBuiltDependencies
# Keep both until the release pins one pnpm version via a `packageManager` field.
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
