# Source analysis only. This runs on pull_request, never pull_request_target, so fork code receives
# no elevated repository token. It does not build or render Motion packages.
name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "24 3 * * 2"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # v4.37.5 release commit, resolved from the official GitHub release. JavaScript/TypeScript
      # needs no project build for CodeQL extraction, so avoiding an install also avoids executing
      # package lifecycle scripts while analysing an untrusted fork pull request.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
