# Pull-request dependency changes only. `pull_request_target` would expose a stronger token to fork
# content, so it is intentionally absent; this job receives the default read-only pull-request token.
name: dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v5.0.0 release commit, resolved from the official GitHub release. The action compares the
      # pull-request dependency graph and rejects newly introduced high-or-critical vulnerabilities.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
